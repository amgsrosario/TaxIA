name: Validação de PR

on:
  pull_request:
    branches: [main]
  # CI também sobre cada push para main (deliberação da Administração de 23/11/2026, B.3).
  push:
    branches: [main]

permissions:
  contents: read

# PR: um grupo por número de PR e cancelamento das execuções anteriores do mesmo PR.
# Push para main: um grupo por execução (run_id), sem cancelamento nem espera atrás de outro push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validation-pr-{0}', github.event.pull_request.number) || format('pr-validation-push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (compilação e testes seleccionados)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # CI mínimo v1: compila main e test e executa apenas uma lista explícita
      # de classes sem estado partilhado entre si.
      #
      # A dependência de ordem da suite completa `mvn test` no H2 partilhado
      # foi corrigida com H2TestDatabaseCleaner (src/test). Promover a suite
      # completa a gate continua a ser decisão do chat executivo TaxIA; até lá,
      # a suite completa não é gate.
      #
      # Critério de selecção:
      # - no máximo um @SpringBootTest (KnowledgeFlowApplicationTests, perfil
      #   `test`: H2 e provider `stub`), para nenhuma outra classe escrever na
      #   mesma base H2 em memória;
      # - HealthControllerTest é um slice @WebMvcTest sem base de dados;
      # - as restantes são testes unitários sem contexto Spring, sem rede e
      #   sem escrita em disco (clientes HTTP apenas com MockRestServiceServer).
      # Os testes *IT (Testcontainers/PostgreSQL) continuam fora do Surefire.
      - name: Testes backend seleccionados
        run: |
          tests=(
            KnowledgeFlowApplicationTests
            HealthControllerTest
            SecretsHygieneTest
            JwtSecretPolicyTest
            TokenVersionClaimTest
            StaffPasswordPolicyTest
            UserCredentialDomainTest
            StaffAccountAdminGuardsTest
            StaffAdminRecoveryLauncherTest
            PilotDatasourceCredentialsTest
            PilotAiProviderDefaultsTest
            AtFaqE9cPilotFlagTest
            AIProviderResolverTest
            AnthropicProviderTest
            OpenAIProviderTest
            DefaultAIServiceTest
            AIExceptionMappingTest
            TaxiaSystemPromptTest
            ContextSufficiencyEvaluatorTest
            AnswerGroundingValidatorTest
            GroundingServiceTest
            LegalReferenceNormalizationTest
            TextualClaimEquivalenceTest
            GroundingDeadlineInstrumentNegationTest
            SafeResponseFactoryTest
            AnswerDecisionServiceTest
            M4BRiskPropagationTest
            M4BFoundationsGroundingTest
            SourceFreshnessPolicyTest
            FreshnessDecisionTest
            DocumentedAnswerCriticalScenariosTest
            PgContainersUsageTest
          )
          mvn -B test -Dtest="$(IFS=,; echo "${tests[*]}")"
          # O Surefire ignora em silêncio um nome sem correspondência; falhar
          # se alguma classe da lista não produziu relatório.
          missing=0
          for t in "${tests[@]}"; do
            if ! compgen -G "target/surefire-reports/TEST-*.${t}.xml" > /dev/null; then
              echo "::error::Classe de teste listada não executada: ${t}"
              missing=1
            fi
          done
          exit "$missing"

  frontend:
    name: Frontend (typecheck e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      # `build` executa `tsc --noEmit` antes do `vite build`.
      - name: Typecheck e build
        run: npm run build

  integration:
    name: Integração PostgreSQL (Testcontainers)
    runs-on: ubuntu-latest
    # Calibrado pela primeira execução no ubuntu-latest (PR #35, 23/11/2026): 4 CPUs, 15 GiB,
    # Docker 29.4.2; 298 ITs em 2 min 42 s. 15 min dá cerca de 5x de margem.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Registo dos recursos do runner (deliberação de 23/11/2026: testes de integração sujeitos
      # à verificação dos recursos disponíveis).
      - name: Recursos do runner
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
          docker version --format 'Docker Engine {{.Server.Version}}'
          docker info --format 'Docker: CPUs={{.NCPU}} Memória={{.MemTotal}}'
      # Só os testes *IT (Failsafe, perfil pgtest), com pgvector/pgvector:pg16 em Testcontainers.
      # Os testes unitários seleccionados correm no job backend.
      - name: Testes de integração
        run: mvn -B verify -Ppgtest -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
